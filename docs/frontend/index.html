<!DOCTYPE html>
<html>
<head>
  <title>Genezis-AI</title>
  <style>
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    #world {
      height: 400px;
      background: linear-gradient(#87ceeb, #228b22);
      position: relative;
      overflow: hidden;
    }

    #head {
      position: absolute;
      font-size: 60px;
      left: 50%;
      top: 160px;
      transform: translateX(-50%);
    }

    #bar {
      padding: 20px;
      background: #222;
    }

    input {
      width: 70%;
      padding: 10px;
    }
  </style>
</head>

<body>

<h1>🌍 Genezis-AI</h1>
<div id="status">
  <h2>🙂 Genesis</h2>
  <p>Energie: 100%</p>
  <p>Honger: 20%</p>
  <p>Geld: 0 GEN</p>
  <p>Werk: geen</p>
</div>

<div id="world">
  <div id="head">🙂</div>
</div>

<div id="bar">
  <input placeholder="Geef een opdracht aan de wereld...">
</div>

</body>
</html>
